{% extends "base.html" %}
{% block content %}
<h1>Dive Log</h1>
{% if user %}
    <p>Logged in as {{ user.name }}</p>
    <p><a href="/dives">Your dives</a></p>
    <form method="post" action="/logout"><button type="submit">Log out</button></form>
{% else %}
    <p><a href="/login">Log in</a> or <a href="/signup">sign up</a></p>
{% endif %}
{% endblock %}
