{% extends "base.html" %}
{% block title %}{{ site.name }} - Be the Fish{% endblock %}
{% block content %}
<p class="card-meta"><a href="/sites">&larr; All sites</a></p>
<h1>{{ site.name }}</h1>
<p><span class="badge">{{ site.location }}</span></p>
{% if site.description %}
<div class="card"><p>{{ site.description }}</p></div>
{% endif %}
{% endblock %}
