{# Site dropdown + visibility + current. Shared by dives/new.html and dives/detail.html.
   Expects site_choices, visibility_levels, current_levels, and optionally
   selected_site_id, selected_visibility, selected_current. #}
<label>Search sites <input type="search" data-filter-select="#site-select"
    placeholder="Name or location"></label><br>
<label>Site
    <select name="site_id" id="site-select">
        <option value="">No site</option>
        {% for choice in site_choices %}
        <option value="{{ choice.id }}" {% if choice.id == selected_site_id %}selected{% endif %}>{{ choice.label }}</option>
        {% endfor %}
    </select>
</label><br>
<small>Missing a site? Contact the admin to have it added.</small><br>
<label>Visibility
    <select name="visibility">
        <option value="">Not recorded</option>
        {% for level in visibility_levels %}
        <option value="{{ level }}" {% if level == selected_visibility %}selected{% endif %}>{{ level }}</option>
        {% endfor %}
    </select>
</label><br>
<label>Current
    <select name="current">
        <option value="">Not recorded</option>
        {% for level in current_levels %}
        <option value="{{ level }}" {% if level == selected_current %}selected{% endif %}>{{ level }}</option>
        {% endfor %}
    </select>
</label><br>
