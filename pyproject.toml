[project]
name = "divelog"
version = "0.1.0"
description = "Strava-style dive logbook for scuba, freediving and spearfishing"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
