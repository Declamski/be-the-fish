[project]
name = "be-the-fish-sites"
version = "0.1.0"
description = "Be the Fish sites service: read-only dive site catalogue"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "pymssql>=2.4.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
